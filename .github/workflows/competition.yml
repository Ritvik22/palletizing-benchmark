name: Competition tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  competition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r competition/requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest competition/tests -q
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/order-panel.test.cjs tests/portal.test.cjs tests/result-dataset.test.cjs tests/order-revisions.test.cjs
      - run: node --check competition/static/portal.js
