<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pack Visualizer — Pallet by SKU</title>
<style>
  :root{--bg:#0b0e14;--panel:#121724;--panel2:#171d2e;--line:#232b40;--text:#e6eaf2;--dim:#8b94ab;--faint:#5a6379;--accent:#38bdf8;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;height:100vh;overflow:hidden}
  #app{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100vh}
  #stage{position:relative;background:#fff;--line:#cbd8e0;--text:#18303b;--dim:#506473;--faint:#516875}
  #stage canvas{display:block}
  .side{border-left:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
  h1{font-size:16px;font-weight:750;letter-spacing:-.01em}
  .sub{font-size:12px;color:var(--faint);margin-top:2px}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:650;display:block;margin-bottom:6px}
  select,input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px}
  .row{display:flex;gap:8px}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
  .seg button{flex:1;background:transparent;border:none;color:var(--dim);font-size:12px;padding:7px 4px;border-radius:6px;cursor:pointer}
  .seg button.active{background:var(--line);color:var(--text);font-weight:600}
  .stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
  /* benchmark table: dataset-wide engine comparison */
  #bench table{width:100%;border-collapse:collapse;font-size:12px}
  #bench th{color:var(--faint);font-weight:600;text-align:right;padding:0 0 5px;
            font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  #bench th:first-child{text-align:left}
  #bench td{padding:5px 0;border-top:1px solid var(--line);text-align:right;
            font-variant-numeric:tabular-nums}
  #bench td:first-child{text-align:left;font-weight:600}
  #bench td.best{color:var(--accent)}
  #bench .note{color:var(--faint);font-size:11px;line-height:1.5;margin-top:9px}
  #bench .sub{color:var(--dim);font-size:11px;margin-top:11px;
              padding-top:8px;border-top:1px solid var(--line)}
  #bench .rowdesc{color:var(--faint);font-size:10.5px;font-weight:400;
                  display:block;margin-top:1px}
  .stats .k{color:var(--dim)} .stats .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
  .legend{display:flex;flex-direction:column;gap:5px;max-height:38vh;overflow-y:auto;font-size:12px}
  .legend .sw{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:6px;cursor:pointer}
  .legend .sw:hover{background:var(--panel2)}
  .legend .dot{width:12px;height:12px;border-radius:3px;flex:none}
  .legend .lab{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend .qty{color:var(--dim);font-variant-numeric:tabular-nums}
  #tooltip{position:absolute;pointer-events:none;background:rgba(255,255,255,.97);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;display:none;z-index:5;max-width:220px}
  #tooltip .td{color:var(--dim)}
  .hint{position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--faint);pointer-events:none}
  .seqbar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;padding:7px 14px;z-index:4;
    width:min(520px,calc(100% - 32px))}
  .seqbar button{background:transparent;border:none;color:var(--text);font-size:13px;cursor:pointer;padding:0 2px;line-height:1}
  .seqbar input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--line);outline:none;padding:0;border:none}
  .seqbar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
  .seqbar input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
  .seqcount{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .badge{display:inline-block;font-size:11px;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .views{display:flex;flex-direction:column;gap:6px}
  .view{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--text);font-size:13px;cursor:pointer;text-align:left;width:100%;font-family:inherit}
  .view:hover:not(:disabled){border-color:#31405f}
  .view.active{border-color:var(--accent);background:rgba(56,189,248,.09)}
  .view.active .vname{color:var(--accent);font-weight:650}
  .view:disabled{opacity:.42;cursor:default}
  .vname{font-weight:500}
  .vname .vsub{color:var(--faint);font-weight:400}
  .vmeta{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--dim);z-index:4;pointer-events:none}
  .chip b{color:var(--text);font-weight:600}
  @media(max-width:820px){
    body{height:auto;overflow:auto}
    #app{grid-template-columns:minmax(0,1fr);height:auto}
    #stage{height:62vh;min-height:300px}
    .side{border-left:none;border-top:1px solid var(--line)}
    .legend{max-height:none}
  }
  body.embed h1,body.embed .sub,body.embed #pickWrap{display:none}
  /* The parent order dialog owns scrolling and all strategy controls. */
  body.embed{height:100vh;overflow:hidden}
  body.embed #app{display:block;height:100vh}
  body.embed #stage{height:100vh;min-height:0;width:100%}
  body.embed .side{display:none}
  body.embed .hint{bottom:57px;color:#516875;font-size:12px}
  .seqbar input:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
  .seqbar button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('embed')==='1') document.body.classList.add('embed');</script>
<div id="app">
  <div id="stage">
    <div id="tooltip"></div>
    <div class="chip" id="viewChip" style="display:none"></div>
    <div class="hint">drag to orbit · scroll to zoom · right-drag to pan</div>
    <div class="seqbar" id="seqBar" style="display:none">
      <button id="seqPlay" title="replay the build order">&#9654;</button>
      <input type="range" id="seqSlider" min="0" max="0" value="0" step="1" aria-label="Boxes shown in build sequence">
      <span class="seqcount" id="seqCount"></span>
    </div>
  </div>
  <div class="side">
    <div>
      <h1>Pack Visualizer</h1>
      <div class="sub">Pallet layout, boxes grouped by SKU · <span id="unit">metres</span></div>
    </div>
    <div id="pickWrap">
      <label>Pack (order)</label>
      <div class="row">
        <select id="packSel"></select>
        <button id="randBtn" title="random pack" style="width:40px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;cursor:pointer">🎲</button>
      </div>
    </div>
    <div>
      <label>Pack view</label>
      <div class="views" id="sourceList">
        <button class="view" data-src="packed" id="srcPacked" disabled><span class="vname">Phase 1+2</span><span class="vmeta" id="metaPacked">&mdash;</span></button>
        <button class="view" data-src="remainder" id="srcRemainder" disabled><span class="vname">Phase 1+2 Remainder</span><span class="vmeta" id="metaRem">&mdash;</span></button>
        <button class="view" data-src="ep" id="srcEp" disabled><span class="vname">EP Hybrid</span><span class="vmeta" id="metaEp">&mdash;</span></button>
        <button class="view" data-src="epv4" id="srcEpv4" disabled><span class="vname">EP Bounded</span><span class="vmeta" id="metaEpv4">&mdash;</span></button>
        <button class="view" data-src="neat" id="srcNeat" disabled><span class="vname">NEAT Hybrid</span><span class="vmeta" id="metaNeat">&mdash;</span></button>
        <button class="view" data-src="rl" id="srcRl" disabled><span class="vname">RL Full</span><span class="vmeta" id="metaRl">&mdash;</span></button>
        <button class="view" data-src="rr" id="srcRr" disabled><span class="vname">RL + ReRanker</span><span class="vmeta" id="metaRr">&mdash;</span></button>
        <button class="view active" data-src="schematic"><span class="vname">Schematic by SKU</span><span class="vmeta" id="metaSch">&mdash;</span></button>
      </div>
    </div>
    <div id="layoutWrap">
      <label>Layout</label>
      <div class="seg" id="layoutSeg">
        <button data-mode="stack" class="active">Stacks by SKU</button>
        <button data-mode="layers">Layered pallet</button>
      </div>
    </div>
    <div id="benchWrap" style="display:none">
      <label>Benchmark &mdash; whole dataset</label>
      <div id="bench"></div>
    </div>
    <div>
      <label>Summary</label>
      <div class="stats" id="stats"></div>
    </div>
    <div>
      <label>SKUs in pack <span id="skuCount" class="badge"></span></label>
      <div class="legend" id="legend"></div>
    </div>
  </div>
</div>

<script src="/viz-static/three.min.js"></script>
<script src="/viz-static/OrbitControls.min.js"></script>
<script src="/viz-static/order-panel.js?v=2"></script>
<script>
const API = "";  // same origin
const PALETTE = ["#38bdf8","#a78bfa","#34d399","#fbbf24","#f87171","#f472b6","#22d3ee","#a3e635","#fb923c","#818cf8",
                 "#2dd4bf","#e879f9","#facc15","#60a5fa","#4ade80","#fca5a5","#c084fc","#5eead4","#fde047","#93c5fd"];

let scene, camera, renderer, controls, raycaster, mouse;
let packGroup = null, boxMeshes = [];
let SKUS = {};           // sku_id -> {length,width,height,weight,name}
let curItems = [];       // [{sku_id, quantity}]
let curOrderId = null;
let layoutMode = "stack";

function initThree(){
  const stage = document.getElementById("stage");
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#ffffff");
  camera = new THREE.PerspectiveCamera(45, stage.clientWidth/stage.clientHeight, 0.01, 200);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
  stage.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  const key = new THREE.DirectionalLight(0xffffff, 0.7); key.position.set(3,6,2); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(-4,3,-3); scene.add(fill);
  raycaster = new THREE.Raycaster(); mouse = new THREE.Vector2();
  renderer.domElement.addEventListener("mousemove", onHover);
  window.addEventListener("resize", onResize);
  animate();
}
function onResize(){
  const stage = document.getElementById("stage");
  camera.aspect = stage.clientWidth/stage.clientHeight; camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
}
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }

// Stable per-SKU color within a pack (assigned first-seen order), so the
// schematic, packed, and remainder views all color a SKU identically.
let skuColorMap = {};
function colorOf(sku_id){
  if(!(sku_id in skuColorMap))
    skuColorMap[sku_id] = PALETTE[Object.keys(skuColorMap).length % PALETTE.length];
  return skuColorMap[sku_id];
}
// ---- dataset-wide benchmark summary -------------------------------------
// Figures come from /viz-api/benchmark-summary, computed by
// build_benchmark_summary.py from the packs this site serves, so anything shown
// here can be checked by opening an order.
async function loadBenchmark(){
  let d=null;
  try { d = await (await fetch("/viz-api/benchmark-summary")).json(); }
  catch(e){ return; }
  if(!d || !d.available || !(d.methods||[]).length) return;
  const pc = v => v==null ? "&mdash;" : (100*v).toFixed(1)+"%";
  const n3 = v => v==null ? "&mdash;" : v.toFixed(3);
  // Best per column, so the leader is visible without reading every number.
  const bestComplete = Math.max(...d.methods.map(m=>m.complete_frac??0));
  const bestLve = Math.min(...d.methods.map(m=>m.lve_mean??9e9));
  let h = '<table><tr><th>engine</th><th>complete</th><th>boxes</th><th>LVE</th></tr>';
  for(const m of d.methods){
    const c1 = (m.complete_frac===bestComplete) ? ' class="best"' : '';
    const c2 = (m.lve_mean===bestLve) ? ' class="best"' : '';
    h += `<tr><td>${m.label}</td><td${c1}>${pc(m.complete_frac)}</td>`
       + `<td>${pc(m.placed_frac)}</td><td${c2}>${n3(m.lve_mean)}</td></tr>`;
  }
  h += '</table>';
  h += `<div class="note">${d.orders_in_db} orders, `
     + `${(d.boxes_in_db||0).toLocaleString()} boxes. `
     + `LVE is bounding volume over box volume &mdash; <b>lower is tighter</b>, `
     + `and 1.0 would be a solid block. Each engine's LVE covers only the orders `
     + `it packed in full, so the columns are not on the same footing.</div>`;
  // The matched view is the one that IS on the same footing.
  if(d.matched && d.matched.lve){
    const byKey = Object.fromEntries(d.methods.map(m=>[m.key,m.label]));
    const rows = Object.entries(d.matched.lve).sort((a,b)=>a[1]-b[1]);
    h += `<div class="sub"><b>On the ${d.matched.orders} orders every engine `
       + `completed</b> &mdash; the like-for-like compactness comparison:<table>`
       + `<tr><th>engine</th><th>LVE</th></tr>`
       + rows.map(([k,v])=>
           `<td>${byKey[k]||k}</td><td${v===rows[0][1]?' class="best"':''}>`
           + `${v.toFixed(3)}</td>`).map(r=>`<tr>${r}</tr>`).join("")
       + `</table></div>`;
  }
  if(d.baseline){
    h += `<div class="sub"><b>${d.baseline.label}</b> &mdash; `
       + `${pc(d.baseline.placed_frac)} of boxes, `
       + `${pc(d.baseline.complete_frac)} of orders complete.`
       + `<span class="rowdesc">The deterministic prefix every engine starts `
       + `from. It stops before the remainder-filling phase by design, so it is `
       + `the shared starting point, not a competing method.</span></div>`;
  }
  document.getElementById("bench").innerHTML = h;
  document.getElementById("benchWrap").style.display = "block";
}
if(!document.body.classList.contains('embed')) loadBenchmark();

let curResult = null;    // {available, placed, remainder} phase-1/2 result for curOrderId
let curEp = null, curNeat=null, curRl=null, curRr=null, curEp4=null;        // {available, pack} full EP pack (phases 1+2+3) for curOrderId
let sourceMode = "schematic";  // "packed" | "remainder" | "schematic"
let requestedView = new URLSearchParams(location.search).get('view');
let loadVersion = 0, packReady = false;
function notifyParent(error=false){
  if(window.parent!==window) window.parent.postMessage(
    {type:'pallet-view-ready',orderId:curOrderId,view:sourceMode,error},location.origin);
}
window.addEventListener('message',e=>{
  if(e.origin!==location.origin || e.source!==window.parent || e.data?.type!=='pallet-select-view' ||
      e.data.orderId!==(curOrderId || new URLSearchParams(location.search).get('order')) || !PalletOrderModel.METHODS.some(m=>m.key===e.data.view)) return;
  requestedView=e.data.view;
  if(packReady){sourceMode=requestedView;setSourceButtons();renderCurrent();}
});

// ---- layout builders -------------------------------------------------------
// Each returns {meshesData:[{sku_id,color,pos:[x,y,z],dim:[l,w,h],name}], footprint:[X,Z], top:Y}

function layoutStacks(items){
  // One neat tower per SKU, towers arranged in a grid. Boxes of a SKU tile
  // perfectly (same dims). Cell sized to the largest SKU footprint.
  const skus = items.map((it,i)=>({...it, sku:SKUS[it.sku_id], color:colorOf(it.sku_id)})).filter(s=>s.sku);
  const n = skus.length || 1;
  const cols = Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n/cols);
  const gap = 0.06;
  // cell size from max footprint across the pack
  let cw=0, cd=0;
  skus.forEach(s=>{ cw=Math.max(cw, s.sku.length); cd=Math.max(cd, s.sku.width); });
  // allow up to 3x3 boxes per layer inside a cell
  const perRow=3, perCol=3;
  const cellW = cw*perRow + gap, cellD = cd*perCol + gap;
  const out=[];
  let maxTop=0;
  skus.forEach((s,idx)=>{
    const r=Math.floor(idx/cols), c=idx%cols;
    const ox = c*cellW, oz = r*cellD;
    const {length:L,width:W,height:H} = s.sku;
    const pl=Math.max(1,Math.floor((cellW-gap)/L)), pc=Math.max(1,Math.floor((cellD-gap)/W));
    const perLayer = pl*pc;
    for(let q=0;q<s.quantity;q++){
      const layer=Math.floor(q/perLayer), inLayer=q%perLayer;
      const rr=Math.floor(inLayer/pl), cc=inLayer%pl;
      const x = ox + cc*L + L/2;
      const z = oz + rr*W + W/2;
      const y = layer*H + H/2;
      out.push({sku_id:s.sku_id,name:s.sku.name,color:s.color,pos:[x,y,z],dim:[L,W,H]});
      maxTop=Math.max(maxTop, layer*H+H);
    }
  });
  return {meshesData:out, footprint:[cols*cellW, rows*cellD], top:maxTop};
}

function layoutLayers(items){
  // Fill a real pallet footprint layer by layer, keeping each SKU's boxes
  // contiguous. Shelf-packs left-to-right, wraps rows, then stacks up.
  const PW=0.8, PD=1.2;              // standard pallet footprint (m)
  const gap=0.004;
  const skus = items.map((it,i)=>({...it, sku:SKUS[it.sku_id], color:colorOf(it.sku_id)})).filter(s=>s.sku);
  const out=[];
  let cx=0, cz=0, cy=0, rowDepth=0, maxTop=0;
  skus.forEach(s=>{
    const {length:L,width:W,height:H}=s.sku;
    for(let q=0;q<s.quantity;q++){
      if(cx + L > PW + 1e-6){ cx=0; cz += rowDepth + gap; rowDepth=0; }   // new row
      if(cz + W > PD + 1e-6){ cz=0; cx=0; cy += layerHeight; }            // new layer
      out.push({sku_id:s.sku_id,name:s.sku.name,color:s.color,pos:[cx+L/2, cy+H/2, cz+W/2],dim:[L,W,H]});
      cx += L + gap; rowDepth=Math.max(rowDepth,W);
      maxTop=Math.max(maxTop, cy+H);
    }
    // start each SKU on a fresh column so SKUs stay visually separated
    cx=0; cz += rowDepth + gap; rowDepth=0;
    if(cz > PD){ cz=0; cy += layerHeight; }
  });
  return {meshesData:out, footprint:[PW,PD], top:maxTop};
}
let layerHeight = 0.3; // nominal layer step for the layered mode

// ---- render ---------------------------------------------------------------
function render(items){
  if(packGroup) scene.remove(packGroup);
  packGroup = new THREE.Group(); boxMeshes=[];
  const lay = layoutMode==="stack" ? layoutStacks(items) : layoutLayers(items);
  const [FX,FZ] = lay.footprint;

  // pallet slab
  const slab = new THREE.Mesh(new THREE.BoxGeometry(FX+0.1,0.03,FZ+0.1),
      new THREE.MeshLambertMaterial({color:0x33415e}));
  slab.position.set(FX/2,-0.016,FZ/2); packGroup.add(slab);
  const grid = new THREE.GridHelper(Math.max(FX,FZ)*1.4, 20, 0x233047, 0x141c2c);
  grid.position.set(FX/2,-0.001,FZ/2); packGroup.add(grid);

  lay.meshesData.forEach(m=>{
    const [L,W,H]=m.dim;
    const geo=new THREE.BoxGeometry(L,H,W);
    const mat=new THREE.MeshLambertMaterial({color:new THREE.Color(m.color)});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(m.pos[0],m.pos[1],m.pos[2]);
    const edge=new THREE.LineSegments(new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({color:0x0b0e14,transparent:true,opacity:0.5}));
    mesh.add(edge);
    mesh.userData=m;
    packGroup.add(mesh); boxMeshes.push(mesh);
  });
  scene.add(packGroup);

  // frame camera
  const cx=FX/2, cz=FZ/2, top=Math.max(lay.top,0.3);
  controls.target.set(cx, top*0.4, cz);
  const span=Math.max(FX,FZ,top);
  camera.position.set(cx+span*1.1, top+span*0.9, cz+span*1.3);
  controls.update();
}

function onHover(e){
  const rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hit=raycaster.intersectObjects(boxMeshes.filter(m=>m.visible))[0];
  const tt=document.getElementById("tooltip");
  if(hit){
    const d=hit.object.userData;
    tt.style.display="block"; tt.style.left=(e.clientX-rect.left+14)+"px"; tt.style.top=(e.clientY-rect.top+12)+"px";
    const title=document.createElement('b');title.textContent=d.sku_id;
    const name=document.createElement('span');name.className='td';name.textContent=d.name||'';
    const dims=document.createElement('span');dims.className='td';dims.textContent=d.dim.map(v=>v.toFixed(3)).join(' × ')+' m';
    tt.replaceChildren(title,document.createElement('br'),name,document.createElement('br'),dims);
  } else tt.style.display="none";
}

// ---- packed (real positions) -----------------------------------------------
// Renders a phase-1/2 packformation: boxes at solved centre positions inside the
// real container. Data is z-up (x=width, y=depth, z=height); Three.js is y-up,
// so we map (x, z, y).
function renderPacked(pf){
  if(packGroup) scene.remove(packGroup);
  packGroup = new THREE.Group(); boxMeshes=[];
  const c = pf.container, CW=c.width, CD=c.depth, CH=c.height;

  const slab = new THREE.Mesh(new THREE.BoxGeometry(CW+0.06,0.028,CD+0.06),
      new THREE.MeshLambertMaterial({color:0x33415e}));
  slab.position.set(CW/2,-0.015,CD/2); packGroup.add(slab);
  const cage = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(CW,CH,CD)),
      new THREE.LineBasicMaterial({color:0x3b4a6b}));
  cage.position.set(CW/2,CH/2,CD/2); packGroup.add(cage);

  pf.boxes.forEach(b=>{
    const L=b.dimensions.width, W=b.dimensions.depth, H=b.dimensions.height;
    const geo=new THREE.BoxGeometry(L,H,W);
    const mat=new THREE.MeshLambertMaterial({color:new THREE.Color(colorOf(b.sku_id))});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(b.position.x, b.position.z, b.position.y);
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({color:0x0b0e14,transparent:true,opacity:0.5})));
    mesh.userData={sku_id:b.sku_id, name:(SKUS[b.sku_id]||{}).name, dim:[L,W,H]};
    packGroup.add(mesh); boxMeshes.push(mesh);
  });
  scene.add(packGroup);
  const top = pf.boxes.length ? Math.max(...pf.boxes.map(b=>b.position.z+b.dimensions.height/2)) : CH;
  controls.target.set(CW/2, top*0.45, CD/2);
  const span=Math.max(CW,CD,top);
  camera.position.set(CW/2+span*1.1, top+span*0.8, CD/2+span*1.3);
  controls.update();
}

// Aggregate a box list (remainder) into [{sku_id, quantity}] for schematic layout.
function aggItems(boxes){
  const m={}; boxes.forEach(b=>{ m[b.sku_id]=(m[b.sku_id]||0)+1; });
  return Object.entries(m).map(([sku_id,quantity])=>({sku_id,quantity}));
}

let seqTimer=null;
function stopSeq(){
  if(seqTimer){ clearInterval(seqTimer); seqTimer=null; }
  document.getElementById("seqPlay").innerHTML="&#9654;";
}
function applySeq(){
  const v=+document.getElementById("seqSlider").value;
  boxMeshes.forEach((m,i)=>{ m.visible = i < v; });
  document.getElementById("seqCount").textContent=`${v} / ${boxMeshes.length}`;
}
function setupSeq(){
  stopSeq();
  const bar=document.getElementById("seqBar");
  const isPack=["packed","ep","neat","rl","rr","epv4"].includes(sourceMode);
  if(!(isPack && boxMeshes.length)){ bar.style.display="none"; return; }
  bar.style.display="flex";
  const sl=document.getElementById("seqSlider");
  sl.max=boxMeshes.length; sl.value=boxMeshes.length;
  applySeq();
}
function toggleSeq(){
  if(seqTimer){ stopSeq(); return; }
  const sl=document.getElementById("seqSlider");
  if(+sl.value>=+sl.max) sl.value=0;
  document.getElementById("seqPlay").innerHTML="&#10074;&#10074;";
  seqTimer=setInterval(()=>{
    sl.value=+sl.value+1; applySeq();
    if(+sl.value>=+sl.max) stopSeq();
  }, 90);
}

function renderCurrent(){
  const has = curResult && curResult.available;
  const hasEp = curEp && curEp.available;
  const hasNeat = curNeat && curNeat.available;
  const hasRl = curRl && curRl.available;
  const hasRr = curRr && curRr.available;
  const hasEp4 = curEp4 && curEp4.available;
  const available={packed:has,remainder:has,ep:hasEp,neat:hasNeat,rl:hasRl,rr:hasRr,schematic:true};
  if(!available[sourceMode]){
    if(packGroup){scene.remove(packGroup);packGroup=null;boxMeshes=[];}
    stopSeq(); document.getElementById('seqBar').style.display='none';
    document.getElementById('stats').textContent='No artifact is available for the selected strategy.';
    notifyParent(true);return;
  }
  if(sourceMode==="packed" && has){ renderPacked(curResult.placed); renderStats(); }
  else if(sourceMode==="ep" && hasEp){ renderPacked(curEp.pack); renderStats(); }
  else if(sourceMode==="neat" && hasNeat){ renderPacked(curNeat.pack); renderStats(); }
  else if(sourceMode==="rl" && hasRl){ renderPacked(curRl.pack); renderStats(); }
  else if(sourceMode==="rr" && hasRr){ renderPacked(curRr.pack); renderStats(); }
  else if(sourceMode==="epv4" && hasEp4){ renderPacked(curEp4.pack); renderStats(); }
  else if(sourceMode==="remainder" && has){ render(aggItems(curResult.remainder.boxes)); renderStats(); }
  else { render(curItems); renderStats(); }
  setupSeq();
  document.getElementById("layoutWrap").style.display =
    (sourceMode==="packed"||sourceMode==="ep"||sourceMode==="neat"||sourceMode==="rl"||sourceMode==="rr"||sourceMode==="epv4") ? "none" : "block";
  notifyParent();
}

// ---- data + UI ------------------------------------------------------------
function renderStats(){
  const has = curResult && curResult.available;
  // When this pack reached the site. Comes from the deploy repo's git history
  // (see build_pack_provenance.py) -- the commit that introduced the file, and
  // the commit that last rewrote it. "Added" and "Updated" are shown separately
  // only when they differ, because for most packs they are the same push.
  const provOf = m =>
      m==="ep"        ? (curEp && curEp.provenance) :
      m==="neat"      ? (curNeat && curNeat.provenance) :
      m==="rl"        ? (curRl && curRl.provenance) :
      m==="rr"        ? (curRr && curRr.provenance) :
      m==="epv4"      ? (curEp4 && curEp4.provenance) :
      (m==="packed"||m==="remainder") ? (curResult && curResult.provenance) : null;
  const fmtDate = iso => {
    if(!iso) return null;
    const d = new Date(iso);
    if(isNaN(d)) return null;
    return d.toLocaleString(undefined,
      {year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  };
  const order = PalletOrderModel.orderSummary(curItems,Object.values(SKUS));
  const num = (v,d=3) => typeof v==='number' && Number.isFinite(v) ? v.toLocaleString(undefined,{maximumFractionDigits:d}) : 'Not available';
  const rows=[["Order",curOrderId||"—"],["Order SKUs",order.skus],["Order items",order.items],
    ["Order weight (kg)",num(order.weight,2)],["Order item volume (m³)",num(order.volume,4)]];
  const shown = sourceMode==="ep" ? (curEp && curEp.available ? curEp.pack : null)
              : sourceMode==="neat" ? (curNeat && curNeat.available ? curNeat.pack : null)
              : sourceMode==="rl" ? (curRl && curRl.available ? curRl.pack : null)
              : sourceMode==="rr" ? (curRr && curRr.available ? curRr.pack : null)
              : sourceMode==="epv4" ? (curEp4 && curEp4.available ? curEp4.pack : null)
              : sourceMode==="packed" ? (has ? curResult.placed : null) : null;
  if(shown){
    const st=PalletOrderModel.packStats(shown,order);
    rows.push(['Placed',`${st.placed} / ${order.items}`],['Remaining',st.remaining],
      ['Stack height (m)',num(st.top)],['Placed volume (m³)',num(st.volume,4)],
      ['LVE · lower is tighter',num(st.lve)]);
    st.warnings.forEach(w=>rows.push(['Check artifact',w]));
  }
  if(sourceMode==="remainder" && has)
    rows.push(["Remainder boxes", curResult.remainder.boxes.length]);
  const pv = provOf(sourceMode);
  if(pv){
    const added = fmtDate(pv.added), updated = fmtDate(pv.updated);
    if(added) rows.push(["Added", added]);
    if(pv.changed && updated) rows.push(["Updated", updated]);
    if(pv.commit) rows.push(["Published by", pv.commit]);
  }
  document.getElementById("stats").replaceChildren(...rows.flatMap(r=>r.map((text,i)=>{
    const s=document.createElement('span');s.className=i?'v':'k';s.textContent=String(text);return s;
  })));
  // legend reflects the SKUs of whatever is on screen
  const items = shown ? aggItems(shown.boxes) : (sourceMode==="remainder" && has) ? aggItems(curResult.remainder.boxes) : curItems;
  document.getElementById("skuCount").textContent=items.length;
  document.getElementById("legend").replaceChildren(...items.map(it=>{
    const row=document.createElement('div');row.className='sw';
    const dot=document.createElement('span');dot.className='dot';dot.style.background=colorOf(it.sku_id);
    const name=document.createElement('span');name.className='lab';name.textContent=it.sku_id;
    const qty=document.createElement('span');qty.className='qty';qty.textContent='×'+it.quantity;
    row.append(dot,name,qty);return row;
  }));
}

const VIEW_LABELS = {packed:"Phase 1+2", ep:"EP Hybrid", neat:"NEAT Hybrid",
                     rl:"RL Full", rr:"RL + ReRanker", remainder:"Phase 1+2 Remainder", schematic:"Schematic by SKU"};
function setSourceButtons(){
  const has = curResult && curResult.available;
  const hasEp = curEp && curEp.available;
  const hasNeat = curNeat && curNeat.available;
  const hasRl = curRl && curRl.available;
  const hasRr = curRr && curRr.available;
  const hasEp4 = curEp4 && curEp4.available;
  const totalBoxes = curItems.reduce((a,b)=>a+b.quantity,0);
  const fmt = p => Array.isArray(p?.boxes) ? `${p.boxes.length} / ${totalBoxes}` : 'Invalid artifact';
  [["srcPacked", has,    "metaPacked", has    ? fmt(curResult.placed) : "not computed"],
   ["srcEp",     hasEp,  "metaEp",     hasEp  ? fmt(curEp.pack)       : "not computed"],
   ["srcNeat",   hasNeat,"metaNeat",   hasNeat? fmt(curNeat.pack)     : "not computed"],
   ["srcRl",     hasRl,  "metaRl",     hasRl  ? fmt(curRl.pack)       : "not computed"],
   ["srcRr",     hasRr,  "metaRr",     hasRr  ? fmt(curRr.pack)       : "not computed"],
   ["srcEpv4",   hasEp4, "metaEpv4",   hasEp4 ? fmt(curEp4.pack)      : "not computed"],
   ["srcRemainder", has, "metaRem",    has ? `${curResult.remainder.boxes.length} boxes` : "—"],
  ].forEach(([id,on,mid,meta])=>{
    const b=document.getElementById(id); if(!b) return;
    b.disabled=!on;
    document.getElementById(mid).textContent=meta;
  });
  document.getElementById("metaSch").textContent = `${totalBoxes} boxes`;
  [...document.getElementById("sourceList").children].forEach(b=>
    b.classList.toggle("active", b.dataset.src===sourceMode));
  const chip=document.getElementById("viewChip");
  if(curOrderId){
    chip.style.display="block";
    const title=document.createElement('b');title.textContent=curOrderId;
    chip.replaceChildren(title,document.createTextNode(' · '+(VIEW_LABELS[sourceMode]||'')));
  }
}

async function loadPack(orderId){
  const version=++loadVersion;packReady=false;
  curOrderId=orderId; skuColorMap={};
  const data = await (await fetch(`${API}/viz-api/orders/${orderId}`)).json();
  if(version!==loadVersion) return;
  curItems = data.items||[];
  curItems.forEach(it=>colorOf(it.sku_id));   // assign stable colors in item order
  // Both packs for this order: phase 1+2, and the full EP pack when it exists.
  // Fetched together so switching between them is instant — the whole point is
  // comparing the same order under the two, and a spinner between them hides the
  // difference you are trying to see.
  const packs = await Promise.all([
    fetch(`${API}/viz-api/result/${orderId}`).then(r=>r.json()).catch(()=>null),
    fetch(`${API}/viz-api/ep-result/${orderId}`).then(r=>r.json()).catch(()=>null),
    fetch(`${API}/viz-api/neat-result/${orderId}`).then(r=>r.json()).catch(()=>null),
    fetch(`${API}/viz-api/rl-result/${orderId}`).then(r=>r.json()).catch(()=>null),
  
    fetch(`${API}/viz-api/rr-result/${orderId}`).then(r=>r.json()).catch(()=>null),
    fetch(`${API}/viz-api/epv4-result/${orderId}`).then(r=>r.json()).catch(()=>null)]);
  if(version!==loadVersion) return;
  [curResult, curEp, curNeat, curRl, curRr]=packs;
  packReady=true;
  // Default to the phase 1+2 packed result when it's been computed.
  sourceMode = (curResult && curResult.available) ? "packed" : "schematic";
  if(PalletOrderModel.METHODS.some(m=>m.key===requestedView)) sourceMode=requestedView;
  setSourceButtons();
  renderCurrent();
}

async function boot(){
  initThree();
  const skus=await (await fetch(`${API}/viz-api/skus`)).json();
  skus.forEach(s=>SKUS[s.sku_id]=s);
  const orders=await (await fetch(`${API}/viz-api/orders`)).json();
  const sel=document.getElementById("packSel");
  sel.replaceChildren(...orders.map(o=>{
    const option=document.createElement('option');option.value=o.order_id;
    option.textContent=o.order_id+' — '+o.sku_count+' SKUs, '+o.total_boxes+' boxes';return option;
  }));
  sel.addEventListener("change",()=>loadPack(sel.value));
  document.getElementById("randBtn").addEventListener("click",()=>{
    const o=orders[Math.floor(Math.random()*orders.length)];
    sel.value=o.order_id; loadPack(o.order_id);
  });
  document.getElementById("layoutSeg").addEventListener("click",e=>{
    if(!e.target.dataset.mode) return;
    layoutMode=e.target.dataset.mode;
    [...e.currentTarget.children].forEach(b=>b.classList.toggle("active",b===e.target));
    renderCurrent();
  });
  document.getElementById("seqPlay").addEventListener("click",toggleSeq);
  document.getElementById("seqSlider").addEventListener("input",()=>{ stopSeq(); applySeq(); });
  document.getElementById("sourceList").addEventListener("click",e=>{
    const btn=e.target.closest("button.view");
    if(!btn || btn.disabled || !btn.dataset.src) return;
    sourceMode=btn.dataset.src;
    setSourceButtons();
    renderCurrent();
  });
  // Optional ?order=ID to preselect a specific pack (used when embedded from
  // the database site's "View" action).
  const qs = new URLSearchParams(location.search);
  if(qs.get("order") && window.self !== window.top) document.body.classList.add("embed");
  const want = qs.get("order");
  const known = want && orders.some(o=>o.order_id===want);
  if(want && !known){
    // Say so rather than quietly showing a different pack. This used to fall
    // through to orders[0], so an embed asking for an order that did not resolve
    // rendered someone else's pallet under that order's name — wrong data
    // presented as right, which is the worst way for a viewer to fail.
    document.getElementById("stats").innerHTML =
      '<span class="k">Order</span><span class="v">' + want.replace(/[<>&]/g,"") + '</span>' +
      '<span class="k">Status</span><span class="v">not in this dataset</span>';
    document.getElementById("legend").innerHTML = "";
    console.warn("[viz] no such order:", want);
  }
  const start = known ? want : (orders.length ? orders[0].order_id : null);
  if(start && !(want && !known)){ sel.value=start; await loadPack(start); }
}
boot().catch(e=>{notifyParent(true);document.getElementById('stats').textContent='The selected order could not load.';console.error(e);});
</script>
