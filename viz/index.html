<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pack Visualizer — Pallet by SKU</title>
<style>
  :root{--bg:#0b0e14;--panel:#121724;--panel2:#171d2e;--line:#232b40;--text:#e6eaf2;--dim:#8b94ab;--faint:#5a6379;--accent:#38bdf8;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;height:100vh;overflow:hidden}
  #app{display:grid;grid-template-columns:1fr 320px;height:100vh}
  #stage{position:relative;background:#0d1119}
  #stage canvas{display:block}
  .side{border-left:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
  h1{font-size:16px;font-weight:750;letter-spacing:-.01em}
  .sub{font-size:12px;color:var(--faint);margin-top:2px}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:650;display:block;margin-bottom:6px}
  select,input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px}
  .row{display:flex;gap:8px}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
  .seg button{flex:1;background:transparent;border:none;color:var(--dim);font-size:12px;padding:7px 4px;border-radius:6px;cursor:pointer}
  .seg button.active{background:var(--line);color:var(--text);font-weight:600}
  .stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
  .stats .k{color:var(--dim)} .stats .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
  .legend{display:flex;flex-direction:column;gap:5px;max-height:38vh;overflow-y:auto;font-size:12px}
  .legend .sw{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:6px;cursor:pointer}
  .legend .sw:hover{background:var(--panel2)}
  .legend .dot{width:12px;height:12px;border-radius:3px;flex:none}
  .legend .lab{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend .qty{color:var(--dim);font-variant-numeric:tabular-nums}
  #tooltip{position:absolute;pointer-events:none;background:rgba(13,17,25,.96);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;display:none;z-index:5;max-width:220px}
  #tooltip .td{color:var(--dim)}
  .hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--faint);pointer-events:none}
  .badge{display:inline-block;font-size:11px;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="tooltip"></div>
    <div class="hint">drag to orbit · scroll to zoom · right-drag to pan</div>
  </div>
  <div class="side">
    <div>
      <h1>Pack Visualizer</h1>
      <div class="sub">Pallet layout, boxes grouped by SKU · <span id="unit">metres</span></div>
    </div>
    <div>
      <label>Pack (order)</label>
      <div class="row">
        <select id="packSel"></select>
        <button id="randBtn" title="random pack" style="width:40px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;cursor:pointer">🎲</button>
      </div>
    </div>
    <div>
      <label>View <span id="resultBadge" class="badge" style="display:none">phase 1+2</span></label>
      <div class="seg" id="sourceSeg">
        <button data-src="packed" id="srcPacked" disabled style="opacity:.4">Phase 1+2 packed</button>
        <button data-src="ep" id="srcEp" disabled style="opacity:.4" title="all three phases">Full EP pack</button>
        <button data-src="remainder" id="srcRemainder" disabled style="opacity:.4">Remainder</button>
        <button data-src="schematic" class="active">Schematic by SKU</button>
      </div>
    </div>
    <div id="layoutWrap">
      <label>Layout</label>
      <div class="seg" id="layoutSeg">
        <button data-mode="stack" class="active">Stacks by SKU</button>
        <button data-mode="layers">Layered pallet</button>
      </div>
    </div>
    <div>
      <label>Summary</label>
      <div class="stats" id="stats"></div>
    </div>
    <div>
      <label>SKUs in pack <span id="skuCount" class="badge"></span></label>
      <div class="legend" id="legend"></div>
    </div>
  </div>
</div>

<script src="/viz-static/three.min.js"></script>
<script src="/viz-static/OrbitControls.min.js"></script>
<script>
const API = "";  // same origin
const PALETTE = ["#38bdf8","#a78bfa","#34d399","#fbbf24","#f87171","#f472b6","#22d3ee","#a3e635","#fb923c","#818cf8",
                 "#2dd4bf","#e879f9","#facc15","#60a5fa","#4ade80","#fca5a5","#c084fc","#5eead4","#fde047","#93c5fd"];

let scene, camera, renderer, controls, raycaster, mouse;
let packGroup = null, boxMeshes = [];
let SKUS = {};           // sku_id -> {length,width,height,weight,name}
let curItems = [];       // [{sku_id, quantity}]
let curOrderId = null;
let layoutMode = "stack";

function initThree(){
  const stage = document.getElementById("stage");
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#0d1119");
  camera = new THREE.PerspectiveCamera(45, stage.clientWidth/stage.clientHeight, 0.01, 200);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
  stage.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  const key = new THREE.DirectionalLight(0xffffff, 0.7); key.position.set(3,6,2); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(-4,3,-3); scene.add(fill);
  raycaster = new THREE.Raycaster(); mouse = new THREE.Vector2();
  renderer.domElement.addEventListener("mousemove", onHover);
  window.addEventListener("resize", onResize);
  animate();
}
function onResize(){
  const stage = document.getElementById("stage");
  camera.aspect = stage.clientWidth/stage.clientHeight; camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
}
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }

// Stable per-SKU color within a pack (assigned first-seen order), so the
// schematic, packed, and remainder views all color a SKU identically.
let skuColorMap = {};
function colorOf(sku_id){
  if(!(sku_id in skuColorMap))
    skuColorMap[sku_id] = PALETTE[Object.keys(skuColorMap).length % PALETTE.length];
  return skuColorMap[sku_id];
}
let curResult = null;    // {available, placed, remainder} phase-1/2 result for curOrderId
let curEp = null;        // {available, pack} full EP pack (phases 1+2+3) for curOrderId
let sourceMode = "schematic";  // "packed" | "remainder" | "schematic"

// ---- layout builders -------------------------------------------------------
// Each returns {meshesData:[{sku_id,color,pos:[x,y,z],dim:[l,w,h],name}], footprint:[X,Z], top:Y}

function layoutStacks(items){
  // One neat tower per SKU, towers arranged in a grid. Boxes of a SKU tile
  // perfectly (same dims). Cell sized to the largest SKU footprint.
  const skus = items.map((it,i)=>({...it, sku:SKUS[it.sku_id], color:colorOf(it.sku_id)})).filter(s=>s.sku);
  const n = skus.length || 1;
  const cols = Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n/cols);
  const gap = 0.06;
  // cell size from max footprint across the pack
  let cw=0, cd=0;
  skus.forEach(s=>{ cw=Math.max(cw, s.sku.length); cd=Math.max(cd, s.sku.width); });
  // allow up to 3x3 boxes per layer inside a cell
  const perRow=3, perCol=3;
  const cellW = cw*perRow + gap, cellD = cd*perCol + gap;
  const out=[];
  let maxTop=0;
  skus.forEach((s,idx)=>{
    const r=Math.floor(idx/cols), c=idx%cols;
    const ox = c*cellW, oz = r*cellD;
    const {length:L,width:W,height:H} = s.sku;
    const pl=Math.max(1,Math.floor((cellW-gap)/L)), pc=Math.max(1,Math.floor((cellD-gap)/W));
    const perLayer = pl*pc;
    for(let q=0;q<s.quantity;q++){
      const layer=Math.floor(q/perLayer), inLayer=q%perLayer;
      const rr=Math.floor(inLayer/pl), cc=inLayer%pl;
      const x = ox + cc*L + L/2;
      const z = oz + rr*W + W/2;
      const y = layer*H + H/2;
      out.push({sku_id:s.sku_id,name:s.sku.name,color:s.color,pos:[x,y,z],dim:[L,W,H]});
      maxTop=Math.max(maxTop, layer*H+H);
    }
  });
  return {meshesData:out, footprint:[cols*cellW, rows*cellD], top:maxTop};
}

function layoutLayers(items){
  // Fill a real pallet footprint layer by layer, keeping each SKU's boxes
  // contiguous. Shelf-packs left-to-right, wraps rows, then stacks up.
  const PW=0.8, PD=1.2;              // standard pallet footprint (m)
  const gap=0.004;
  const skus = items.map((it,i)=>({...it, sku:SKUS[it.sku_id], color:colorOf(it.sku_id)})).filter(s=>s.sku);
  const out=[];
  let cx=0, cz=0, cy=0, rowDepth=0, maxTop=0;
  skus.forEach(s=>{
    const {length:L,width:W,height:H}=s.sku;
    for(let q=0;q<s.quantity;q++){
      if(cx + L > PW + 1e-6){ cx=0; cz += rowDepth + gap; rowDepth=0; }   // new row
      if(cz + W > PD + 1e-6){ cz=0; cx=0; cy += layerHeight; }            // new layer
      out.push({sku_id:s.sku_id,name:s.sku.name,color:s.color,pos:[cx+L/2, cy+H/2, cz+W/2],dim:[L,W,H]});
      cx += L + gap; rowDepth=Math.max(rowDepth,W);
      maxTop=Math.max(maxTop, cy+H);
    }
    // start each SKU on a fresh column so SKUs stay visually separated
    cx=0; cz += rowDepth + gap; rowDepth=0;
    if(cz > PD){ cz=0; cy += layerHeight; }
  });
  return {meshesData:out, footprint:[PW,PD], top:maxTop};
}
let layerHeight = 0.3; // nominal layer step for the layered mode

// ---- render ---------------------------------------------------------------
function render(items){
  if(packGroup) scene.remove(packGroup);
  packGroup = new THREE.Group(); boxMeshes=[];
  const lay = layoutMode==="stack" ? layoutStacks(items) : layoutLayers(items);
  const [FX,FZ] = lay.footprint;

  // pallet slab
  const slab = new THREE.Mesh(new THREE.BoxGeometry(FX+0.1,0.03,FZ+0.1),
      new THREE.MeshLambertMaterial({color:0x33415e}));
  slab.position.set(FX/2,-0.016,FZ/2); packGroup.add(slab);
  const grid = new THREE.GridHelper(Math.max(FX,FZ)*1.4, 20, 0x233047, 0x141c2c);
  grid.position.set(FX/2,-0.001,FZ/2); packGroup.add(grid);

  lay.meshesData.forEach(m=>{
    const [L,W,H]=m.dim;
    const geo=new THREE.BoxGeometry(L,H,W);
    const mat=new THREE.MeshLambertMaterial({color:new THREE.Color(m.color)});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(m.pos[0],m.pos[1],m.pos[2]);
    const edge=new THREE.LineSegments(new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({color:0x0b0e14,transparent:true,opacity:0.5}));
    mesh.add(edge);
    mesh.userData=m;
    packGroup.add(mesh); boxMeshes.push(mesh);
  });
  scene.add(packGroup);

  // frame camera
  const cx=FX/2, cz=FZ/2, top=Math.max(lay.top,0.3);
  controls.target.set(cx, top*0.4, cz);
  const span=Math.max(FX,FZ,top);
  camera.position.set(cx+span*1.1, top+span*0.9, cz+span*1.3);
  controls.update();
}

function onHover(e){
  const rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hit=raycaster.intersectObjects(boxMeshes)[0];
  const tt=document.getElementById("tooltip");
  if(hit){
    const d=hit.object.userData;
    tt.style.display="block"; tt.style.left=(e.clientX-rect.left+14)+"px"; tt.style.top=(e.clientY-rect.top+12)+"px";
    tt.innerHTML=`<b>${d.sku_id}</b><br><span class="td">${d.name||""}</span><br>`+
      `<span class="td">${(d.dim[0]).toFixed(3)} × ${(d.dim[1]).toFixed(3)} × ${(d.dim[2]).toFixed(3)} m</span>`;
  } else tt.style.display="none";
}

// ---- packed (real positions) -----------------------------------------------
// Renders a phase-1/2 packformation: boxes at solved centre positions inside the
// real container. Data is z-up (x=width, y=depth, z=height); Three.js is y-up,
// so we map (x, z, y).
function renderPacked(pf){
  if(packGroup) scene.remove(packGroup);
  packGroup = new THREE.Group(); boxMeshes=[];
  const c = pf.container, CW=c.width, CD=c.depth, CH=c.height;

  const slab = new THREE.Mesh(new THREE.BoxGeometry(CW+0.06,0.028,CD+0.06),
      new THREE.MeshLambertMaterial({color:0x33415e}));
  slab.position.set(CW/2,-0.015,CD/2); packGroup.add(slab);
  const cage = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(CW,CH,CD)),
      new THREE.LineBasicMaterial({color:0x3b4a6b}));
  cage.position.set(CW/2,CH/2,CD/2); packGroup.add(cage);

  pf.boxes.forEach(b=>{
    const L=b.dimensions.width, W=b.dimensions.depth, H=b.dimensions.height;
    const geo=new THREE.BoxGeometry(L,H,W);
    const mat=new THREE.MeshLambertMaterial({color:new THREE.Color(colorOf(b.sku_id))});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(b.position.x, b.position.z, b.position.y);
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({color:0x0b0e14,transparent:true,opacity:0.5})));
    mesh.userData={sku_id:b.sku_id, name:(SKUS[b.sku_id]||{}).name, dim:[L,W,H]};
    packGroup.add(mesh); boxMeshes.push(mesh);
  });
  scene.add(packGroup);
  const top = pf.boxes.length ? Math.max(...pf.boxes.map(b=>b.position.z+b.dimensions.height/2)) : CH;
  controls.target.set(CW/2, top*0.45, CD/2);
  const span=Math.max(CW,CD,top);
  camera.position.set(CW/2+span*1.1, top+span*0.8, CD/2+span*1.3);
  controls.update();
}

// Aggregate a box list (remainder) into [{sku_id, quantity}] for schematic layout.
function aggItems(boxes){
  const m={}; boxes.forEach(b=>{ m[b.sku_id]=(m[b.sku_id]||0)+1; });
  return Object.entries(m).map(([sku_id,quantity])=>({sku_id,quantity}));
}

function renderCurrent(){
  const has = curResult && curResult.available;
  const hasEp = curEp && curEp.available;
  if(sourceMode==="packed" && has){ renderPacked(curResult.placed); renderStats(); }
  else if(sourceMode==="ep" && hasEp){ renderPacked(curEp.pack); renderStats(); }
  else if(sourceMode==="remainder" && has){ render(aggItems(curResult.remainder.boxes)); renderStats(); }
  else { render(curItems); renderStats(); }
  document.getElementById("layoutWrap").style.display =
    (sourceMode==="packed"||sourceMode==="ep") ? "none" : "block";
}

// ---- data + UI ------------------------------------------------------------
function renderStats(){
  const has = curResult && curResult.available;
  const totalBoxes=curItems.reduce((a,b)=>a+b.quantity,0);
  const rows=[["Order",curOrderId||"—"],["Distinct SKUs",curItems.length],["Total boxes",totalBoxes]];
  if(has){
    const s=curResult.placed.stats||{};
    rows.push(["Phase 1+2 placed", `${s.placed} / ${s.total}`]);
    rows.push(["Remainder", `${s.remainder}`]);
  }
  const hasEp = curEp && curEp.available;
  if(hasEp){
    const e=curEp.pack.stats||{};
    rows.push(["Full EP placed", `${e.placed} / ${e.total}`]);
    // Phase 3 is the only difference between the two views, so name what it added
    // rather than making the reader subtract two numbers themselves.
    if(has){
      const p12=(curResult.placed.stats||{}).placed;
      if(typeof p12==="number" && typeof e.placed==="number")
        rows.push(["Added by phase 3", `+${e.placed - p12}`]);
    }
  }
  const shown = sourceMode==="ep" ? (hasEp ? curEp.pack : null)
              : sourceMode==="packed" ? (has ? curResult.placed : null) : null;
  if(shown && shown.boxes.length){
    const top=Math.max(0,...shown.boxes.map(b=>b.position.z+b.dimensions.height/2));
    rows.push(["Top of stack", `${top.toFixed(3)} m / ${shown.container.height}`]);
  }
  document.getElementById("stats").innerHTML =
    rows.map(r=>`<span class="k">${r[0]}</span><span class="v">${r[1]}</span>`).join("");
  // legend reflects the SKUs of whatever is on screen
  const items = (sourceMode==="remainder" && has) ? aggItems(curResult.remainder.boxes) : curItems;
  document.getElementById("skuCount").textContent=items.length;
  document.getElementById("legend").innerHTML=items.map(it=>
    `<div class="sw"><span class="dot" style="background:${colorOf(it.sku_id)}"></span>`+
    `<span class="lab">${it.sku_id}</span><span class="qty">×${it.quantity}</span></div>`).join("");
}

function _unusedRenderStatsAndLegend(items){
  const totalBoxes=items.reduce((a,b)=>a+b.quantity,0);
  const totalWeight=items.reduce((a,b)=>a+(SKUS[b.sku_id]?SKUS[b.sku_id].weight*b.quantity:0),0);
  const vol=items.reduce((a,b)=>{const s=SKUS[b.sku_id];return a+(s?s.length*s.width*s.height*b.quantity:0);},0);
  document.getElementById("stats").innerHTML=
    `<span class="k">Order</span><span class="v">${curOrderId||"—"}</span>`+
    `<span class="k">Distinct SKUs</span><span class="v">${items.length}</span>`+
    `<span class="k">Total boxes</span><span class="v">${totalBoxes}</span>`+
    `<span class="k">Total weight</span><span class="v">${totalWeight.toFixed(1)} kg</span>`+
    `<span class="k">Box volume</span><span class="v">${vol.toFixed(3)} m³</span>`;
  document.getElementById("skuCount").textContent=items.length;
  const leg=document.getElementById("legend");
  leg.innerHTML=items.map((it,i)=>{
    const s=SKUS[it.sku_id]||{};
    return `<div class="sw" data-i="${i}"><span class="dot" style="background:${colorOf(it.sku_id)}"></span>`+
      `<span class="lab">${it.sku_id}</span><span class="qty">×${it.quantity}</span></div>`;
  }).join("");
}

function setSourceButtons(){
  const has = curResult && curResult.available;
  const hasEp = curEp && curEp.available;
  const badge = document.getElementById("resultBadge");
  badge.style.display = has ? "inline-block" : "none";
  badge.textContent = sourceMode==="ep" ? "all 3 phases" : "phase 1+2";
  [["srcPacked",has],["srcRemainder",has],["srcEp",hasEp]].forEach(([id,on])=>{
    const b=document.getElementById(id);
    b.disabled = !on; b.style.opacity = on ? "1" : ".4";
    if(id==="srcEp") b.title = on ? "all three phases"
      : "the full EP pack for this order has not been computed yet";
  });
  [...document.getElementById("sourceSeg").children].forEach(b=>
    b.classList.toggle("active", b.dataset.src===sourceMode));
}

async function loadPack(orderId){
  curOrderId=orderId; skuColorMap={};
  const data = await (await fetch(`${API}/viz-api/orders/${orderId}`)).json();
  curItems = data.items||[];
  curItems.forEach(it=>colorOf(it.sku_id));   // assign stable colors in item order
  // Both packs for this order: phase 1+2, and the full EP pack when it exists.
  // Fetched together so switching between them is instant — the whole point is
  // comparing the same order under the two, and a spinner between them hides the
  // difference you are trying to see.
  [curResult, curEp] = await Promise.all([
    fetch(`${API}/viz-api/result/${orderId}`).then(r=>r.json()).catch(()=>null),
    fetch(`${API}/viz-api/ep-result/${orderId}`).then(r=>r.json()).catch(()=>null),
  ]);
  // Default to the phase 1+2 packed result when it's been computed.
  sourceMode = (curResult && curResult.available) ? "packed" : "schematic";
  setSourceButtons();
  renderCurrent();
}

async function boot(){
  initThree();
  const skus=await (await fetch(`${API}/viz-api/skus`)).json();
  skus.forEach(s=>SKUS[s.sku_id]=s);
  const orders=await (await fetch(`${API}/viz-api/orders`)).json();
  const sel=document.getElementById("packSel");
  sel.innerHTML=orders.map(o=>`<option value="${o.order_id}">${o.order_id} — ${o.sku_count} SKUs, ${o.total_boxes} boxes</option>`).join("");
  sel.addEventListener("change",()=>loadPack(sel.value));
  document.getElementById("randBtn").addEventListener("click",()=>{
    const o=orders[Math.floor(Math.random()*orders.length)];
    sel.value=o.order_id; loadPack(o.order_id);
  });
  document.getElementById("layoutSeg").addEventListener("click",e=>{
    if(!e.target.dataset.mode) return;
    layoutMode=e.target.dataset.mode;
    [...e.currentTarget.children].forEach(b=>b.classList.toggle("active",b===e.target));
    renderCurrent();
  });
  document.getElementById("sourceSeg").addEventListener("click",e=>{
    const src=e.target.dataset.src;
    if(!src || e.target.disabled) return;
    sourceMode=src;
    [...e.currentTarget.children].forEach(b=>b.classList.toggle("active",b===e.target));
    renderCurrent();
  });
  // Optional ?order=ID to preselect a specific pack (used when embedded from
  // the database site's "View" action).
  const want = new URLSearchParams(location.search).get("order");
  const start = (want && orders.some(o=>o.order_id===want)) ? want
              : (orders.length ? orders[0].order_id : null);
  if(start){ sel.value=start; loadPack(start); }
}
boot();
</script>
</body>
</html>
