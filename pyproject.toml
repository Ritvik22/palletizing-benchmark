[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "palletizing-benchmark-competition"
version = "0.1.0"
description = "Packing benchmark submission API and MCP connector"
requires-python = ">=3.11"
license = {file = "competition/LICENSE"}
authors = [{name = "Brandon Coats"}]
dependencies = ["httpx==0.28.1", "mcp==1.30.0"]

[project.scripts]
palletizing-mcp = "competition.mcp_server:main"

[tool.setuptools.packages.find]
include = ["competition*"]
exclude = ["competition.tests*"]

[tool.setuptools.package-data]
competition = ["static/*", "LICENSE"]
